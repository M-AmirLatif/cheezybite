<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none" width="100%" height="100%">
  <defs>
    <filter id="whiteLogoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Left: Black Circular Mascot Emblem -->
  <g transform="translate(6, 4)">
    <!-- Outer Black Circle -->
    <circle cx="36" cy="36" r="36" fill="#141414" stroke="#FFC20E" stroke-width="2.5" />
    <!-- White Inner Rim Arc -->
    <path d="M12 28 A 28 28 0 0 1 60 28" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Chef Character Inside Circle -->
    <!-- Chef Hat -->
    <path d="M25 19 C21 19 19 16 20 13 C21 9 26 8 28 10 C31 6 38 6 41 10 C44 8 49 9 50 13 C51 16 49 19 45 19 Z" fill="#FFFFFF" stroke="#141414" stroke-width="1.2" />
    <path d="M25 19 L45 19 L44 24 L26 24 Z" fill="#FFFFFF" stroke="#141414" stroke-width="1.2" />
    <line x1="28" y1="21.5" x2="42" y2="21.5" stroke="#FFC20E" stroke-width="1.5" />

    <!-- Head / Face -->
    <path d="M28 23 C28 20 42 20 42 23 L42 29 C42 34 38 37 35 37 C32 37 28 34 28 29 Z" fill="#FCD34D" />
    <!-- Beard & Hair -->
    <path d="M27 24 C26 27 27 34 31 37 C33 38.5 37 38.5 39 37 C43 34 44 27 43 24 C41 27 39 28 35 28 C31 28 29 27 27 24 Z" fill="#1E1E1E" />
    <!-- Mustache -->
    <path d="M30 30 C32 29 35 31 35 31 C35 31 38 29 40 30 C41 31 40 33 38 32.5 C36 32 35 33 35 33 C35 33 34 32 32 32.5 C30 33 29 31 30 30 Z" fill="#1E1E1E" />
    <!-- Eyes & Brows -->
    <circle cx="32" cy="26" r="1" fill="#1E1E1E" />
    <circle cx="38" cy="26" r="1" fill="#1E1E1E" />

    <!-- Chef Yellow Uniform Coat -->
    <path d="M22 41 C24 37 28 36 35 36 C42 36 46 37 48 41 L52 50 L18 50 Z" fill="#FFC20E" stroke="#141414" stroke-width="1" />
    <!-- Coat Buttons -->
    <circle cx="33" cy="40" r="0.9" fill="#141414" />
    <circle cx="37" cy="40" r="0.9" fill="#141414" />
    <circle cx="33" cy="44" r="0.9" fill="#141414" />
    <circle cx="37" cy="44" r="0.9" fill="#141414" />

    <!-- Food Tray in Hands -->
    <ellipse cx="35" cy="48" rx="20" ry="3.5" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="0.8" />
    <!-- Burger on Tray -->
    <path d="M26 47 C26 43 33 43 33 47 Z" fill="#F59E0B" />
    <rect x="25.5" y="47" width="8" height="1.5" rx="0.5" fill="#78350F" />
    <rect x="26" y="48.5" width="7" height="1" rx="0.5" fill="#FBBF24" />
    <!-- Drink with straw -->
    <rect x="40" y="43" width="5" height="6.5" rx="1" fill="#EF4444" />
    <line x1="42.5" y1="43" x2="44.5" y2="39" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />
    <!-- French Fries box -->
    <path d="M34 45 L39 45 L38 49 L35 49 Z" fill="#DC2626" />
    <line x1="35" y1="45" x2="35" y2="42" stroke="#FDE047" stroke-width="1" />
    <line x1="36.5" y1="45" x2="36.5" y2="41" stroke="#FDE047" stroke-width="1" />
    <line x1="38" y1="45" x2="38" y2="42.5" stroke="#FDE047" stroke-width="1" />

    <!-- Small curved banner at bottom of mascot circle -->
    <path d="M16 57 C22 62 48 62 56 57 L54 64 C46 68 24 68 18 64 Z" fill="#8B1A1A" stroke="#FFC20E" stroke-width="0.8" />
    <text x="36" y="62.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">EST. KASUR</text>
  </g>

  <!-- Right: Official Hand-lettered Style "Cheezy Bite" for Dark Backgrounds -->
  <g transform="translate(86, 0)">
    <!-- Chef Hat on top left of C -->
    <g transform="translate(4, 3) rotate(-12) scale(0.68)">
      <path d="M8 18 C3 17 1 12 4 8 C6 2 14 2 17 5 C21 0 29 1 31 5 C36 2 43 4 43 9 C45 15 41 18 36 18 Z" fill="#FFFDF7" />
      <path d="M8 18 L36 18 L34 23 L10 23 Z" fill="#FFFDF7" />
      <circle cx="15" cy="10" r="1.5" fill="#FFC20E" />
      <circle cx="23" cy="8" r="1.5" fill="#FFC20E" />
      <circle cx="30" cy="11" r="1.5" fill="#FFC20E" />
    </g>

    <!-- Smiling Pizza Slice with Cheese Pull -->
    <g transform="translate(112, 5) scale(0.65)">
      <path d="M4 10 C12 6 24 6 32 10 L28 14 C22 11 14 11 8 14 Z" fill="#FFC20E" />
      <path d="M8 14 L28 14 L18 36 Z" fill="#FFC20E" />
      <circle cx="15" cy="18" r="2.5" fill="#8B1A1A" />
      <circle cx="21" cy="22" r="2" fill="#8B1A1A" />
      <circle cx="16" cy="26" r="1.5" fill="#8B1A1A" />
      <path d="M18 36 C17 39 17 42 19 44 C20 42 20 39 19 36 Z" fill="#FFC20E" />
    </g>

    <!-- Wordmark "Cheezy" in Crisp White -->
    <text x="6" y="44" font-family="'Lilita One', 'Impact', cursive" font-size="38" font-weight="900" fill="#FFFDF7" letter-spacing="-0.5">
      Cheezy
    </text>

    <!-- Wordmark "Bite" in Golden Yellow -->
    <text x="32" y="68" font-family="'Lilita One', 'Impact', cursive" font-size="28" font-weight="900" fill="#FFC20E" letter-spacing="1">
      Bite
    </text>

    <!-- Cheese Drips hanging from "Cheezy" in White -->
    <path d="M14 43 C14 48 12 51 13.5 53 C15 51 16 48 16 43 Z" fill="#FFFDF7" />
    <path d="M20 43 C20 49 18 53 19.5 55 C21 53 22 49 22 43 Z" fill="#FFFDF7" />
    <path d="M44 43 C44 47 43 49 44 51 C45 49 46 47 46 43 Z" fill="#FFFDF7" />
    <path d="M68 43 C68 49 66 52 67.5 54 C69 52 70 49 70 43 Z" fill="#FFFDF7" />
    <path d="M86 43 C86 48 85 51 86 53 C87 51 88 48 88 43 Z" fill="#FFFDF7" />

    <!-- Cheese Drips hanging from "Bite" in Gold -->
    <path d="M48 68 C48 73 47 75 48 77 C49 75 50 73 50 68 Z" fill="#FFC20E" />
    <path d="M72 68 C72 74 71 76 72.5 78 C74 76 75 74 75 68 Z" fill="#FFC20E" />

    <!-- Fork extension in White -->
    <g transform="translate(132, 44)">
      <path d="M-6 -4 C10 -4 16 2 28 6 L52 7" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M52 4 C55 4 58 5 60 7 C58 9 55 10 52 10 Z" fill="#FFFDF7" />
      <line x1="60" y1="4" x2="68" y2="4" stroke="#FFFDF7" stroke-width="1.8" stroke-linecap="round" />
      <line x1="60" y1="6" x2="69" y2="6" stroke="#FFFDF7" stroke-width="1.8" stroke-linecap="round" />
      <line x1="60" y1="8" x2="69" y2="8" stroke="#FFFDF7" stroke-width="1.8" stroke-linecap="round" />
      <line x1="60" y1="10" x2="68" y2="10" stroke="#FFFDF7" stroke-width="1.8" stroke-linecap="round" />
      <path d="M12 2 C12 6 11 8 12.5 10 C13.5 8 14 6 14 2 Z" fill="#FFFDF7" />
    </g>

    <!-- Tagline underneath in bright golden yellow -->
    <text x="102" y="74" font-family="'Plus Jakarta Sans', cursive, sans-serif" font-style="italic" font-weight="800" font-size="9.5" fill="#FFC20E" letter-spacing="0.4">
      Lets Eat Together! Wah G Wah
    </text>
  </g>
</svg>
